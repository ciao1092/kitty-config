# Cursor appearance
cursor_shape beam
cursor_shape_unfocused hollow
cursor_beam_thickness 1.5
cursor #FFFFFF

# Smooth blinking
cursor_blink_interval 0.6 ease-in-out
cursor_stop_blinking_after 0

# Smooth movement and trailing
cursor_trail 1
cursor_trail_decay 0.08 0.20
cursor_trail_start_threshold 1
cursor_trail_color none

# Smooth motion-blur shader (Kitty 0.49+)
custom_shaders cursor-trail-motion-blur

# Keep the beam cursor at shell prompts
shell_integration no-cursor

# Rendering
sync_to_monitor yes

map ctrl+shift+f show_scrollback

# Default window size: 90 columns × 25 rows
remember_window_size no
initial_window_width 90c
initial_window_height 25c
